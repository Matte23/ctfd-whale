{% from "config/macros.html" import submit_button with context %}
<div class="tab-pane fade" id="router" role="tabpanel">
    {% set router_type = get_config("whale:router_type", "frp") %}
    <div class="form-group">
        <label for="router-type">
            Router type
            <small class="form-text text-muted">
                Select which router backend to use
            </small>
        </label>
        {# saved on change by config.js, then the page reloads with its fields #}
        <select id="router-type" class="form-control custom-select">
            {% for type in ["frp", "trp"] %}
                <option value="{{ type }}" {{ "selected" if router_type == type }}>{{ type }}</option>
            {% endfor %}
        </select>
    </div>
    {% include "config/" + router_type + ".router.config.html" %}
    {{ submit_button() }}
</div>
