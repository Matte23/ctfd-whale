# Example deployment of CTFd 3.8.9 with ctfd-whale, based on CTFd's own
# docker-compose.yml. Copy it over CTFd's docker-compose.yml.
#
# Defaults it matches (plugin settings): docker_use_swarm = false,
# docker_auto_connect_network = ctfd_containers, frp_api_url = http://frpc:7400,
# frp_http_port = 8080.

services:
  ctfd:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # CTFd keeps running as its normal non-root user; it only gets the group
    # owning the docker socket. Find its id with: stat -c %g /var/run/docker.sock
    # Note: access to the docker API is equivalent to root on the host anyway,
    # so keep CTFd and its admin accounts as protected as the host itself.
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_started
      cache:
        condition: service_started
    networks:
        default:
        internal:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - ctfd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

  frpc:
    image: frankli0324/frp:frpc
    restart: always
    command: [
      "--server_addr=frps",
      "--server_port=7000",
      "--token=your_token",
      "--admin_addr=0.0.0.0",
      # must match the frp_api_url setting (default http://frpc:7400)
      "--admin_port=7400",
      "--admin_user=frank",
      "--admin_pwd=qwer",
    ]
    networks:
      frp:
      internal:
      containers:

  frps:
    image: frankli0324/frp:frps
    restart: always
    command: [
      "--bind_addr=0.0.0.0",
      "--bind_port=7000",
      "--token=your_token",
      "--subdomain_host=127.0.0.1.nip.io",
      "--vhost_http_port=8080",
    ]
    ports:
      - 8080:8080
    networks:
      frp:
      default:

networks:
    default:
    internal:
        internal: true
    frp:
        internal: true
    # Challenge containers are attached to this network so frpc can reach
    # them. Fixed name: it must match the docker_auto_connect_network setting.
    # With docker_use_swarm = true, use "driver: overlay" and
    # "attachable: true" instead (requires `docker swarm init`).
    containers:
        name: ctfd_containers
        internal: true
        driver: bridge
