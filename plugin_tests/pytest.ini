[pytest]
# This directory is the rootdir on purpose: the repo root is the plugin
# package itself (it has an __init__.py), which pytest would otherwise import
# as a test package before any CTFd app exists. The folder isn't called
# "tests" because CTFd's own tests package, whose helpers the suite uses,
# needs that name. Run with: make test
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    # CTFd's test client uses the "localhost" cookie domain
    ignore:'localhost' is not a valid cookie domain:UserWarning
